name: Daily maintenance (sync, cleanup, release if needed)

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-maintenance
  cancel-in-progress: true

jobs:
  sync-and-cleanup:
    name: Sync fork + cleanup unwanted upstream files
    runs-on: ubuntu-latest
    outputs:
      openwrt_version: ${{ steps.check.outputs.openwrt_version }}
      need_build: ${{ steps.check.outputs.need_build }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync from upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM="this-username-has-been-taken/amneziawg-openwrt"

          git remote remove upstream 2>/dev/null || true
          git remote add upstream "https://github.com/${UPSTREAM}.git"
          git fetch upstream master

          if git merge-base --is-ancestor upstream/master HEAD; then
            echo "Already up to date with upstream"
          else
            echo "Merging upstream/master..."
            if ! git merge upstream/master -m "chore: sync from upstream" -X ours; then
              echo "Merge conflict — keeping our protected files"
              git checkout --ours \
                .github/workflows/release.yml \
                .github/workflows/daily-maintenance.yml \
                .github/workflows/build-packages.yml \
                .github/workflows/build-amneziawg-from-sdk.yml \
                README.md \
                2>/dev/null || true
              git add -A
              git -c core.editor=true merge --continue || \
                git commit -m "chore: sync from upstream (resolved)" || true
            fi
          fi

      - name: Remove unwanted upstream workflow files
        id: cleanup
        run: |
          set -euo pipefail
          changed=false

          for f in \
            .github/workflows/snapshot.yml \
            .github/workflows/build-toolchain-cache.yml \
            .github/workflows/build-amneziawg-from-cache.yml \
            .github/workflows/remove-snapshot.yml
          do
            if [ -f "$f" ]; then
              echo "Removing $f"
              git rm -f "$f"
              changed=true
            fi
          done

          if [ "$changed" = true ]; then
            git commit -m "chore: remove SNAPSHOT and legacy workflows after sync" || true
          else
            echo "Nothing to remove"
          fi

          git push origin HEAD:master || git push origin HEAD:main

      - name: Check if build is needed
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          openwrt=$(curl -fsS https://downloads.openwrt.org/releases/ \
            | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
            | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
            | sort -V \
            | tail -n1)

          if [ -z "$openwrt" ]; then
            echo "Cannot detect latest OpenWrt version"
            exit 1
          fi

          echo "Latest stable OpenWrt: $openwrt"
          echo "openwrt_version=$openwrt" >> "$GITHUB_OUTPUT"

          RELEASE_TAG="latest"
          need_build=true

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' 2>/dev/null || true)
            echo "Existing assets on ${RELEASE_TAG}:"
            echo "$assets"
            if printf '%s\n' "$assets" | grep -q -- "-openwrt-${openwrt}\.tar\.gz$"; then
              echo "Packages for OpenWrt ${openwrt} already present — skip build"
              need_build=false
            else
              echo "Release ${RELEASE_TAG} exists but has no packages for OpenWrt ${openwrt} — need build"
            fi
          else
            echo "Release ${RELEASE_TAG} does not exist — need build"
          fi

          echo "need_build=${need_build}" >> "$GITHUB_OUTPUT"

  release:
    name: Build & publish for latest OpenWrt
    needs: sync-and-cleanup
    if: needs.sync-and-cleanup.outputs.need_build == 'true'
    uses: ./.github/workflows/release.yml
    with:
      amneziawg_version: master
      openwrt_version: ${{ needs.sync-and-cleanup.outputs.openwrt_version }}
      publish: true
      draft: false
      release_tag: latest
    secrets: inherit
