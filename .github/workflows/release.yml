name: Release - Build AmneziaWG for the latest OpenWrt release

# Builds packages for every architecture in .github/targets.json against a
# stable OpenWrt release and attaches them to a GitHub release.
#
# Triggers:
#   - workflow_call   — from daily-maintenance (only when a new OpenWrt is needed)
#   - push of v* tag  — creates a draft release for that tag
#   - workflow_dispatch — manual run
#
# There is NO schedule here. Daily checks live in daily-maintenance.yml.

on:
  workflow_call:
    inputs:
      amneziawg_version:
        description: "YAAWG tag, branch or commit to build from"
        type: string
        required: true
      openwrt_version:
        description: "OpenWrt version, or `latest`"
        type: string
        required: true
      publish:
        description: "Create/update the GitHub release"
        type: boolean
        required: true
      draft:
        description: "Create the release as a draft if it does not exist yet"
        type: boolean
        required: true
      release_tag:
        description: "GitHub release tag to publish under (e.g. latest or v3.1.0)"
        type: string
        required: true

  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      amneziawg_version:
        description: "YAAWG tag, branch or commit to build from"
        type: string
        required: true
        default: "master"
      openwrt_version:
        description: "OpenWrt version, or `latest`"
        type: string
        required: true
        default: "latest"
      publish:
        description: "Create/update the GitHub release"
        type: boolean
        required: true
        default: true
      draft:
        description: "Create the release as a draft if it does not exist yet"
        type: boolean
        required: true
        default: false
      release_tag:
        description: "GitHub release tag to publish under (e.g. latest or v3.1.0)"
        type: string
        required: true
        default: "latest"

permissions:
  contents: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve build parameters
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.params.outputs.targets }}
      openwrt_version: ${{ steps.params.outputs.openwrt_version }}
      amneziawg_version: ${{ steps.params.outputs.amneziawg_version }}
      publish: ${{ steps.params.outputs.publish }}
      draft: ${{ steps.params.outputs.draft }}
      release_tag: ${{ steps.params.outputs.release_tag }}
      skip: ${{ steps.params.outputs.skip }}
    steps:
      - name: Checkout YAAWG repository
        uses: actions/checkout@v5

      - name: Resolve parameters
        id: params
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e -o pipefail

          echo "targets=$(jq -c . .github/targets.json)" >> "$GITHUB_OUTPUT"

          skip=false

          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: build the tagged commit, publish draft release under the same tag
            tag="${{ github.ref_name }}"
            echo "amneziawg_version=$tag" >> "$GITHUB_OUTPUT"
            echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "draft=true" >> "$GITHUB_OUTPUT"

            requested=$(curl -fsS https://downloads.openwrt.org/releases/ \
              | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
              | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
              | sort -V \
              | tail -n1)
          else
            # workflow_call or workflow_dispatch
            echo "amneziawg_version=${{ inputs.amneziawg_version }}" >> "$GITHUB_OUTPUT"
            echo "release_tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"

            requested="${{ inputs.openwrt_version }}"
            if [ -z "$requested" ] || [ "$requested" = "latest" ]; then
              requested=$(curl -fsS https://downloads.openwrt.org/releases/ \
                | grep -oE 'href="[0-9]+\.[0-9]+\.[0-9]+/"' \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' \
                | sort -V \
                | tail -n1)
            fi
          fi

          if [ -z "$requested" ]; then
            echo "Unable to determine the OpenWrt version."
            exit 1
          fi
          echo "openwrt_version=$requested" >> "$GITHUB_OUTPUT"
          echo "Resolved OpenWrt version: $requested"

          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    if: ${{ needs.prepare.outputs.skip != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/build-packages.yml
    with:
      openwrt_version: ${{ needs.prepare.outputs.openwrt_version }}
      amneziawg_version: ${{ needs.prepare.outputs.amneziawg_version }}
      openwrt_target: ${{ matrix.target.target }}
      openwrt_subtarget: ${{ matrix.target.subtarget }}
      artifact_prefix: amneziawg

  publish:
    name: Publish release
    needs: [ prepare, build ]
    if: ${{ needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.skip != 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Pack artifacts
        run: |
          set -e -x
          mkdir dist
          for dir in artifacts/*/; do
            name=$(basename "$dir")
            tar -czf "dist/${name}-openwrt-${{ needs.prepare.outputs.openwrt_version }}.tar.gz" -C "$dir" .
          done
          ls -la dist/

      - name: Attach packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          SOURCE: ${{ needs.prepare.outputs.amneziawg_version }}
          OPENWRT_VERSION: ${{ needs.prepare.outputs.openwrt_version }}
          DRAFT: ${{ needs.prepare.outputs.draft }}
        run: |
          set -e

          # Ensure the release tag exists (needed for rolling tags like `latest`)
          if ! gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "Creating tag ${TAG}..."
            # Point tag at the commit we built from when possible, else master tip
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SOURCE}" >/dev/null 2>&1; then
              sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SOURCE}" --jq .object.sha)
              # Annotated tags resolve to a tag object; peel to commit if needed
              type=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${SOURCE}" --jq .object.type)
              if [ "$type" = "tag" ]; then
                sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq .object.sha)
              fi
            else
              sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/master" --jq .object.sha 2>/dev/null \
                || gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
            fi
            gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${TAG}" \
              -f sha="$sha" >/dev/null
            echo "Tag ${TAG} created at ${sha}"
          fi

          {
            printf 'Packages built from `%s` against OpenWrt %s.\n\n' "$SOURCE" "$OPENWRT_VERSION"
            printf 'Every archive contains `kmod-amneziawg`, `amneziawg-go`, `amneziawg-tools`,\n'
            printf '`luci-proto-amneziawg` and the localization package for one target. Pick the\n'
            printf 'archive matching your `Target Platform` and package architecture, see the\n'
            printf 'README for installation instructions.\n'
          } > notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Updating existing release ${TAG} with OpenWrt ${OPENWRT_VERSION} packages."
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" \
              --notes-file notes.md \
              --title "YAAWG ${TAG} (OpenWrt ${OPENWRT_VERSION})" \
              || true
          else
            echo "Creating release ${TAG} with OpenWrt ${OPENWRT_VERSION} packages."
            extra=()
            if [ "$DRAFT" = "true" ]; then
              extra+=(--draft)
            fi
            gh release create "$TAG" dist/* \
              --title "YAAWG ${TAG} (OpenWrt ${OPENWRT_VERSION})" \
              --notes-file notes.md \
              "${extra[@]}"
          fi
