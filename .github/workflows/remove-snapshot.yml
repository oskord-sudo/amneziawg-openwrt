name: Remove SNAPSHOT after upstream sync

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: write

concurrency:
  group: remove-snapshot
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove snapshot.yml and clean README
        id: cleanup
        run: |
          set -euo pipefail

          changed=false

          # 1. Удаляем snapshot.yml
          if [ -f .github/workflows/snapshot.yml ]; then
            echo "→ Removing .github/workflows/snapshot.yml"
            git rm -f .github/workflows/snapshot.yml
            changed=true
          fi

          # 2. Чистим README.md, если в нём есть SNAPSHOT/snapshot
          if [ -f README.md ] && grep -qiE 'snapshot|SNAPSHOT' README.md; then
            echo "→ Cleaning README.md from SNAPSHOT mentions"

            python3 << 'PY'
          import re

          with open("README.md", "r", encoding="utf-8") as f:
              text = f.read()

          # --- FAQ: binaries ---
          text = re.sub(
              r"(A: Prebuilt packages for the most popular architectures are published on the \[releases page\]\([^)]+\)): a versioned release for the latest stable OpenWRT version and a daily refreshed `snapshot` pre-release for `SNAPSHOT`\.",
              r"\1 for the latest stable OpenWrt version.",
              text,
              flags=re.IGNORECASE,
          )

          # --- FAQ: reasons to compile ---
          text = re.sub(
              r"\n3\. Kernel modules built for `SNAPSHOT` are only installable while the firmware `vermagic` matches\.\n4\.",
              r"\n3.",
              text,
          )
          text = re.sub(
              r"\n3\. Kernel modules built for SNAPSHOT are only installable while the firmware vermagic matches\.\n4\.",
              r"\n3.",
              text,
          )

          # --- Download Prebuilt section ---
          text = re.sub(
              r"- \*\*OpenWRT version:\*\* `SNAPSHOT` or a stable release \(e\.g\., `[^`]+`\), found under",
              r"- **OpenWrt version:** a stable release (e.g., `24.10.2`), found under",
              text,
              flags=re.IGNORECASE,
          )
          text = re.sub(
              r"- \*\*OpenWrt version:\*\* `SNAPSHOT` or a stable release \(e\.g\., `[^`]+`\), found under",
              r"- **OpenWrt version:** a stable release (e.g., `24.10.2`), found under",
              text,
              flags=re.IGNORECASE,
          )

          text = re.sub(
              r"- For a stable release, take it from the latest versioned release\. It is built against the newest stable OpenWRT version\.\n"
              r"- For `SNAPSHOT`, take it from the `snapshot` pre-release, which is rebuilt every day\. Since `SNAPSHOT` firmware changes daily as well, the kernel module only installs while the `vermagic` recorded in `build-info\.txt` matches your firmware \(see \[below\]\(#vermagic-control-for-snapshot-versions\)\)\.\n",
              r"- Take it from the latest versioned release. It is built against the newest stable OpenWrt version.\n",
              text,
              flags=re.IGNORECASE | re.DOTALL,
          )

          # Убираем описание Snapshot workflow
          text = re.sub(
              r"\n2\. `Snapshot - Build AmneziaWG for OpenWrt SNAPSHOT` runs daily and republishes the rolling `snapshot` pre-release\.\n",
              r"\n",
              text,
              flags=re.IGNORECASE,
          )

          # В разделах How to Use ... тоже убираем SNAPSHOT как вариант версии
          text = re.sub(
              r"- \*\*OpenWRT version:\*\* `SNAPSHOT` or a stable release \(e\.g\., `[^`]+`\), found under",
              r"- **OpenWrt version:** a stable release (e.g., `24.10.2`), found under",
              text,
              flags=re.IGNORECASE,
          )
          text = re.sub(
              r"- \*\*OpenWrt version:\*\* `SNAPSHOT` or a stable release \(e\.g\., `[^`]+`\), found under",
              r"- **OpenWrt version:** a stable release (e.g., `24.10.2`), found under",
              text,
              flags=re.IGNORECASE,
          )

          # Удаляем целый блок "Vermagic control for `SNAPSHOT` versions"
          text = re.sub(
              r"\n#### Vermagic control for `SNAPSHOT` versions\n.*?(?=\n#### |\n## |\Z)",
              r"\n#### Vermagic control\n\n"
              r"> **Note:** Every workflow records the `vermagic` on the `Vermagic:` line of `build-info.txt` within the artifacts.\n\n"
              r"Vermagic is a hash calculated for the OpenWrt kernel. When installing kernel-related packages, "
              r"OpenWrt checks if the package's `vermagic` matches the kernel's. If not, installation won't succeed. "
              r"Check your firmware's `vermagic` by running `apk info kernel` or `opkg info kernel` and noting the hash "
              r"after the kernel version in `Version`. For example, `6.6.52~f58afd3748410d3b1baa06a466d6682-r1` means "
              r"`vermagic` is `f58afd3748410d3b1baa06a466d6682`. Every workflow records the compiled package's "
              r"`vermagic` value on the `Vermagic:` line of `build-info.txt` within the artifacts. If these do not match, "
              r"the kernel module cannot be installed.\n",
              text,
              flags=re.IGNORECASE | re.DOTALL,
          )

          # На всякий случай убираем оставшиеся одиночные упоминания snapshot/SNAPSHOT в контексте сборок
          # (не трогаем случайные слова, если их нет)

          with open("README.md", "w", encoding="utf-8") as f:
              f.write(text)

          print("README.md cleaned")
          PY

            changed=true
          fi

          if [ "$changed" = true ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing to clean"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push
        if: steps.cleanup.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove SNAPSHOT workflow and clean README after upstream sync"
          git push
